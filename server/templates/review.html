{% extends "base.html" %}{% load static %}{% block content %}
<section class="workspace narrow document-review">
  <a class="crumb" href="{% url 'home' %}">← 다른 문서 선택</a>
  <h1 id="review-title">주요 내용 확인</h1>
  <p class="document-meta">{{ draft.title }} · {{ draft.document|length }}자</p>
  <section id="policy-summary" aria-labelledby="review-title" data-url="{% url 'summary' %}" data-document-hash="{{ document_hash }}">
    <p id="summary-status" role="status">문서의 주요 내용을 정리하고 있습니다…</p>
    <div id="summary-items"></div>
    <button type="button" id="summary-retry" class="primary" hidden>요약 다시 시도</button>
  </section>
  <form class="review-action" method="post">{% csrf_token %}
    <button class="primary wide" type="submit">쟁점 찾기 <span aria-hidden="true">→</span></button>
  </form>
  <details>
    <summary>원문 전체 보기</summary>
    <div class="source-scroll">
      {% for page in draft.pages %}
      <section><small>{{ page.label }}</small><div class="source-text">{{ page.text }}</div></section>
      {% endfor %}
    </div>
  </details>
</section>
<script src="{% static 'summary.js' %}?v=20261105-8" defer></script>
{% endblock %}
