{% extends "base.html" %}{% load static %}{% block content %}
<section class="workspace narrow" id="debate" data-hash="{{ document_hash }}" data-start="{% url 'debate_start' %}">
  <a class="crumb" href="{% url 'review' %}">← 문서 확인</a>
  <h1>정책 검토 결과</h1>
  <p class="document-meta">{{ draft.title }}</p>

  <div class="result-progress" id="debate-progress-panel">
    <p id="debate-status" role="status" aria-live="polite">해석이 갈리는 조항을 찾고 있습니다…</p>
    <progress id="debate-progress" value="0" aria-label="정책 검토 진행"></progress>
    <button type="button" class="primary" id="debate-retry" hidden>이어서 검토하기</button>
    <p class="upload-note" id="debate-review-note" hidden></p>
  </div>

  <div id="debate-output"></div>
  <details class="result-method">
    <summary>검토 방식과 참고 자료</summary>
    <p>A는 역할별 검토입니다. B는 수집 자료를 참고한 잠정 검토입니다. B의 학사행정 근거에는 기관 지침이 포함됩니다.</p>
    <a class="all-link" href="{% url 'sources' %}">연결된 자료 확인 →</a>
  </details>
  <form id="debate-form" hidden>{% csrf_token %}</form>
  <noscript>검토 결과를 보려면 JavaScript를 켜 주세요.</noscript>
</section>
<script src="{% static 'debate.js' %}?v=20261105-7" defer></script>
{% endblock %}
